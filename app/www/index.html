<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10301F">
<title>ZSL Translator</title>
<style>
  :root {
    --bg: #0C2418;
    --panel: #10301F;
    --ink: #F1F4EF;
    --mint: #C9DECF;
    --muted: #8FA898;
    --line: rgba(201, 222, 207, 0.18);
    --orange: #F08A24;
    --good: #46C27A;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: flex; flex-direction: column; min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; gap: 0.75rem; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em; }
  header h1 span { color: var(--orange); }
  .pill { font-size: 0.8rem; padding: 0.25rem 0.65rem; border-radius: 999px; background: var(--panel); color: var(--mint); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ready { color: var(--good); }
  .pill.err { color: #FF8A80; }

  .stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
  .guess { position: absolute; left: 0.75rem; top: 0.75rem; min-width: 5.5rem; padding: 0.4rem 0.8rem 0.55rem; border-radius: 12px; background: rgba(12, 36, 24, 0.82); backdrop-filter: blur(6px); }
  .guess .sign { font-size: 3.2rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .guess .bar { height: 5px; margin-top: 0.45rem; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .guess .bar i { display: block; height: 100%; width: 0; background: var(--orange); transition: width 0.15s; }
  .guess.sure .bar i { background: var(--good); }
  .guess .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
  .flip { position: absolute; right: 0.75rem; top: 0.75rem; }

  .notice { position: absolute; inset: auto 1rem 1rem; padding: 0.8rem 1rem; border-radius: 12px; background: rgba(12, 36, 24, 0.9); font-size: 0.95rem; line-height: 1.45; }
  .notice[hidden] { display: none; }

  .out { background: var(--panel); border-top: 1px solid var(--line); padding: 0.85rem 1rem 1rem; }
  .text { font-family: var(--mono); font-size: 1.5rem; line-height: 1.35; min-height: 2.1em; max-height: 4.2em; overflow-y: auto; word-break: break-word; }
  .text .caret { display: inline-block; width: 0.55em; border-bottom: 3px solid var(--orange); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .text .placeholder { color: var(--muted); font-family: var(--sans); font-size: 1rem; }
  .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  button { font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.9rem; min-height: 44px; cursor: pointer; }
  button:active { background: rgba(255,255,255,0.18); }
  button.primary { background: var(--orange); border-color: var(--orange); color: #1A1206; }
  button.on { border-color: var(--good); color: var(--good); }
  .row .grow { flex: 1 1 auto; }
  .foot { margin-top: 0.7rem; font-size: 0.75rem; color: var(--muted); }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>ZSL <span>Translator</span></h1>
  <div class="pill" id="status">Loading…</div>
</header>

<main class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="guess" id="guess" aria-live="off">
    <div class="sign" id="sign">–</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hint" id="hint">Show a sign</div>
  </div>
  <button class="flip" id="flip" type="button" aria-label="Switch camera">Flip</button>
  <div class="notice" id="notice" hidden></div>
</main>

<section class="out" aria-label="Translation">
  <div class="text" id="text" aria-live="polite"><span class="placeholder">Signs you hold still for half a second appear here.</span></div>
  <div class="row">
    <button class="primary grow" id="speak" type="button">Speak</button>
    <button id="space" type="button">Space</button>
    <button id="back" type="button" aria-label="Delete last letter">⌫</button>
    <button id="clear" type="button">Clear</button>
    <button id="auto" type="button" aria-pressed="false">Auto-speak</button>
  </div>
  <div class="foot">Works offline. Nothing is recorded or sent anywhere.</div>
</section>

<script src="mediapipe/hands/hands.js"></script>
<script src="mediapipe/pose/pose.js"></script>
<script src="js/zsl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
