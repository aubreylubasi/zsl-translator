plugins {
    id 'com.android.application'
}

android {
    namespace 'zm.aubreylubasi.zsl'
    compileSdk 35

    defaultConfig {
        applicationId 'zm.aubreylubasi.zsl'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'tflite', 'wasm', 'data', 'binarypb'
    }
}
